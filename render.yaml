services:
  - type: web
    name: trust-doe-api
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: python scripts/start_platform.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TRUSTDOE_CORS_ORIGIN
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
