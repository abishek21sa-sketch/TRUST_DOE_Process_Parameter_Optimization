name: trust-doe-ci

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  engineering-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python scripts/run_empirical_validation.py
      - run: python scripts/run_ui_identity_validation.py
      # TEMPORARY diagnostic (remove once root-caused): dumps exact expected-vs-actual
      # hash/byte-count/first-bytes for every mismatch to the run's Job Summary, which
      # renders on the Actions run page without needing sign-in (unlike the raw log
      # viewer). Existing hash-chasing attempts kept failing blind; this replaces
      # guessing with real data from the actual runner.
      - run: python scripts/_ci_diagnose_integrity.py
      - run: python scripts/verify_release_integrity.py
        continue-on-error: true
      - run: python -m compileall -q src intelligence scripts/start_platform.py
